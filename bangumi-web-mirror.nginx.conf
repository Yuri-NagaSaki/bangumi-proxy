# =====================================================================
# Bangumi web mirror - nginx read-only template
# ---------------------------------------------------------------------
# Mirror:
#   mirror.example.com -> bgm.tv
#
# Companion mirrors:
#   api.example.com -> api.bgm.tv
#   img.example.com -> lain.bgm.tv
#
# Scope:
#   This template is for public read-only browsing. It blocks write
#   methods at nginx, strips upstream cookies, rewrites upstream links to
#   mirror domains, and does not use local proxy_cache.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    if ($from_cloudflare = 0) {
        return 403;
    }

    if ($request_method = OPTIONS) {
        return 204;
    }

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host bgm.tv;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-Ray "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer https://bgm.tv$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name bgm.tv;

    proxy_redirect https://bgm.tv/ https://mirror.example.com/;
    proxy_redirect http://bgm.tv/ https://mirror.example.com/;
    proxy_redirect https://bangumi.tv/ https://mirror.example.com/;
    proxy_redirect http://bangumi.tv/ https://mirror.example.com/;
    proxy_redirect https://chii.in/ https://mirror.example.com/;
    proxy_redirect http://chii.in/ https://mirror.example.com/;

    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    sub_filter_once off;
    sub_filter_types
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        application/x-javascript
        text/javascript;

    sub_filter "https://bgm.tv" "https://mirror.example.com";
    sub_filter "http://bgm.tv" "https://mirror.example.com";
    sub_filter "//bgm.tv" "//mirror.example.com";
    sub_filter "SITE_URL = 'https://bgm.tv'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://bgm.tv\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://bangumi.tv" "https://mirror.example.com";
    sub_filter "http://bangumi.tv" "https://mirror.example.com";
    sub_filter "//bangumi.tv" "//mirror.example.com";
    sub_filter "SITE_URL = 'https://bangumi.tv'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://bangumi.tv\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://chii.in" "https://mirror.example.com";
    sub_filter "http://chii.in" "https://mirror.example.com";
    sub_filter "//chii.in" "//mirror.example.com";
    sub_filter "SITE_URL = 'https://chii.in'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://chii.in\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://lain.bgm.tv" "https://img.example.com";
    sub_filter "http://lain.bgm.tv" "https://img.example.com";
    sub_filter "//lain.bgm.tv" "//img.example.com";

    sub_filter "https://api.bgm.tv" "https://api.example.com";
    sub_filter "http://api.bgm.tv" "https://api.example.com";
    sub_filter "//api.bgm.tv" "//api.example.com";

    location = /__health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"role":"web-mirror","upstream":"bgm.tv","mode":"read-only","cache":"cloudflare-only"}\n';
    }

    location ~ ^/(?:css|js|min|img|static)/ {
        proxy_pass https://bgm.tv;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "public, max-age=691200, s-maxage=2592000, immutable" always;
    }

    location / {
        proxy_pass https://bgm.tv;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "public, max-age=60, s-maxage=300" always;
    }
}
