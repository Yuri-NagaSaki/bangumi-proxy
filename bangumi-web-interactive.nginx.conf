# =====================================================================
# Bangumi web mirror - nginx interactive template
# ---------------------------------------------------------------------
# Mirror:
#   mirror.example.com -> bgm.tv
#
# Companion mirrors:
#   api.example.com -> api.bgm.tv
#   img.example.com -> lain.bgm.tv
#
# Scope:
#   This template supports login and normal web interactions. It passes
#   Bangumi cookies, rewrites upstream cookie domains to the mirror host,
#   rewrites upstream links to mirror domains, and does not use local
#   proxy_cache.
#
# Cache policy:
#   - Dynamic web pages: private/no-store, because bgm.tv sets session
#     cookies even for anonymous HTML pages and logged-in pages are user
#     specific.
#   - Static assets under /css, /js, /min, /img, /static: public long TTL.
#   - No local nginx proxy cache or disk temp files for proxied responses.
# =====================================================================

limit_req_zone $binary_remote_addr zone=bangumi_web_login:10m rate=5r/m;

map "$http_origin|$host" $bangumi_web_origin {
    default $http_origin;
    "~^https?://([^/|]+)\|\1$" "https://bgm.tv";
}

map "$http_referer|$host" $bangumi_web_referer {
    default $http_referer;
    "~^https?://([^/|]+)(/.*)?\|\1$" "https://bgm.tv$2";
}

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    if ($from_cloudflare = 0) {
        return 403;
    }

    if ($request_method = TRACE) {
        return 405;
    }

    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    set $bangumi_web_upstream bgm.tv;

    client_max_body_size 8m;
    client_body_buffer_size 512k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host bgm.tv;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $bangumi_web_origin;
    proxy_set_header Referer $bangumi_web_referer;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-Ray "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Host bgm.tv;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name bgm.tv;

    proxy_redirect https://bgm.tv/ https://mirror.example.com/;
    proxy_redirect http://bgm.tv/ https://mirror.example.com/;
    proxy_redirect https://bangumi.tv/ https://mirror.example.com/;
    proxy_redirect http://bangumi.tv/ https://mirror.example.com/;
    proxy_redirect https://chii.in/ https://mirror.example.com/;
    proxy_redirect http://chii.in/ https://mirror.example.com/;

    proxy_cookie_domain .bgm.tv mirror.example.com;
    proxy_cookie_domain bgm.tv mirror.example.com;
    proxy_cookie_domain .bangumi.tv mirror.example.com;
    proxy_cookie_domain bangumi.tv mirror.example.com;
    proxy_cookie_domain .chii.in mirror.example.com;
    proxy_cookie_domain chii.in mirror.example.com;
    proxy_cookie_path / /;

    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header X-Bangumi-Mirror-Mode interactive always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    sub_filter_once off;
    sub_filter_types
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        application/x-javascript
        text/javascript;

    sub_filter "https://bgm.tv" "https://mirror.example.com";
    sub_filter "http://bgm.tv" "https://mirror.example.com";
    sub_filter "//bgm.tv" "//mirror.example.com";
    sub_filter "https:\\/\\/bgm.tv" "https:\\/\\/mirror.example.com";
    sub_filter "http:\\/\\/bgm.tv" "https:\\/\\/mirror.example.com";
    sub_filter "\\/\\/bgm.tv" "\\/\\/mirror.example.com";
    sub_filter "SITE_URL = 'https://bgm.tv'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://bgm.tv\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://bangumi.tv" "https://mirror.example.com";
    sub_filter "http://bangumi.tv" "https://mirror.example.com";
    sub_filter "//bangumi.tv" "//mirror.example.com";
    sub_filter "https:\\/\\/bangumi.tv" "https:\\/\\/mirror.example.com";
    sub_filter "http:\\/\\/bangumi.tv" "https:\\/\\/mirror.example.com";
    sub_filter "\\/\\/bangumi.tv" "\\/\\/mirror.example.com";
    sub_filter "SITE_URL = 'https://bangumi.tv'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://bangumi.tv\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://chii.in" "https://mirror.example.com";
    sub_filter "http://chii.in" "https://mirror.example.com";
    sub_filter "//chii.in" "//mirror.example.com";
    sub_filter "https:\\/\\/chii.in" "https:\\/\\/mirror.example.com";
    sub_filter "http:\\/\\/chii.in" "https:\\/\\/mirror.example.com";
    sub_filter "\\/\\/chii.in" "\\/\\/mirror.example.com";
    sub_filter "SITE_URL = 'https://chii.in'" "SITE_URL = 'https://mirror.example.com'";
    sub_filter "SITE_URL = \"https://chii.in\"" "SITE_URL = \"https://mirror.example.com\"";

    sub_filter "https://lain.bgm.tv" "https://img.example.com";
    sub_filter "http://lain.bgm.tv" "https://img.example.com";
    sub_filter "//lain.bgm.tv" "//img.example.com";
    sub_filter "https:\\/\\/lain.bgm.tv" "https:\\/\\/img.example.com";
    sub_filter "http:\\/\\/lain.bgm.tv" "https:\\/\\/img.example.com";
    sub_filter "\\/\\/lain.bgm.tv" "\\/\\/img.example.com";

    sub_filter "https://api.bgm.tv" "https://api.example.com";
    sub_filter "http://api.bgm.tv" "https://api.example.com";
    sub_filter "//api.bgm.tv" "//api.example.com";
    sub_filter "https:\\/\\/api.bgm.tv" "https:\\/\\/api.example.com";
    sub_filter "http:\\/\\/api.bgm.tv" "https:\\/\\/api.example.com";
    sub_filter "\\/\\/api.bgm.tv" "\\/\\/api.example.com";

    location = /__health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Bangumi-Mirror-Mode interactive always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        return 200 '{"ok":true,"role":"web-mirror","upstream":"bgm.tv","mode":"interactive","cache":"dynamic-no-store-static-cloudflare-only"}\n';
    }

    location = /FollowTheRabbit {
        limit_req zone=bangumi_web_login burst=10 nodelay;
        proxy_pass https://$bangumi_web_upstream$request_uri;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Bangumi-Mirror-Mode interactive always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }

    location ~ ^/(?:css|js|min|img|static)/ {
        proxy_pass https://$bangumi_web_upstream$request_uri;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_ignore_headers Set-Cookie;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "public, max-age=691200, s-maxage=2592000, immutable" always;
        add_header CDN-Cache-Control "public, s-maxage=2592000" always;
        add_header Cloudflare-CDN-Cache-Control "public, s-maxage=2592000" always;
        add_header X-Bangumi-Mirror-Mode interactive always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }

    location / {
        proxy_pass https://$bangumi_web_upstream$request_uri;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Bangumi-Mirror-Mode interactive always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }
}
