# =====================================================================
# Bangumi 反向代理 - nginx 版
# ---------------------------------------------------------------------
# 代理：
#   api.example.com  ->  api.bgm.tv   (会改写 JSON 里的 lain.bgm.tv)
#   img.example.com  ->  lain.bgm.tv  (图片，带边缘缓存)
#
# 使用步骤：
#   1. 把所有 example.com 改成你自己的域名（共 4 处 server_name + 1 处 sub_filter）。
#   2. 准备 TLS 证书（acme.sh / certbot 均可），改下面 ssl_certificate 路径。
#   3. mkdir -p /var/cache/nginx/bgm && chown -R nginx:nginx /var/cache/nginx/bgm
#   4. 把本文件放到 /etc/nginx/conf.d/bangumi-proxy.conf
#   5. nginx -t && systemctl reload nginx
#
# 说明：
#   - proxy_ssl_server_name on 是必须的，上游是 Cloudflare，不带 SNI 握手会失败。
#   - API 关掉 gzip(Accept-Encoding "") 才能让 sub_filter 改写 body。
#   - 图片做 30 天缓存，省回源、抗污染。
# =====================================================================

# ↓↓↓ 这两行放在 http {} 块里（很多发行版 conf.d 已被 http{} include，可直接用；
#      若报 "directive not allowed here"，请把这两行移到主 nginx.conf 的 http{} 内）。
proxy_cache_path /var/cache/nginx/bgm levels=1:2 keys_zone=bgm_img:50m
                 max_size=20g inactive=30d use_temp_path=off;

# ---- API: api.example.com -> api.bgm.tv ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    resolver 1.1.1.1 8.8.8.8 valid=300s;

    location / {
        proxy_pass https://api.bgm.tv;
        proxy_set_header Host api.bgm.tv;
        proxy_ssl_server_name on;
        proxy_ssl_name api.bgm.tv;

        # 关掉压缩，否则 sub_filter 无法改写响应体
        proxy_set_header Accept-Encoding "";

        # 把 JSON 里写死的图片域名换成你自己的图片域名
        sub_filter_once  off;
        sub_filter_types  application/json;
        sub_filter "lain.bgm.tv" "img.example.com";

        # 透传客户端的 Authorization（OAuth token）等
        proxy_pass_request_headers on;

        # CORS（浏览器端调用时放开；纯服务端调用可删掉这段）
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ---- Images: img.example.com -> lain.bgm.tv ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name img.example.com;

    ssl_certificate     /etc/letsencrypt/live/img.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.example.com/privkey.pem;

    resolver 1.1.1.1 8.8.8.8 valid=300s;

    location / {
        proxy_pass https://lain.bgm.tv;
        proxy_set_header Host lain.bgm.tv;
        proxy_ssl_server_name on;
        proxy_ssl_name lain.bgm.tv;

        # 边缘缓存
        proxy_cache bgm_img;
        proxy_cache_key  $uri$is_args$args;
        proxy_cache_valid 200 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ---- 可选：80 -> 443 跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com img.example.com;
    return 301 https://$host$request_uri;
}
