# =====================================================================
# Bangumi reverse proxy - nginx production template
# ---------------------------------------------------------------------
# Proxy routes:
#   api.example.com -> api.bgm.tv   (rewrites JSON image URLs)
#   img.example.com -> lain.bgm.tv  (images, no local disk cache)
#
# Privacy:
#   This template intentionally uses placeholder domains only. Replace
#   api.example.com and img.example.com before deploying.
#
# Deployment:
#   1. Install nginx with http_ssl, http_v2, http_realip, and http_sub.
#      nginx-extras from https://n.wtf/install/ works.
#   2. Issue one TLS certificate covering both hostnames, or adjust the
#      ssl_certificate paths per host.
#   3. Put this file under /etc/nginx/conf.d/bangumi-proxy.conf.
#   4. Create /var/www/letsencrypt if you use webroot ACME renewal.
#   5. Restrict TCP/443 at the firewall to Cloudflare IP ranges. The nginx
#      $from_cloudflare guard below is a second layer, not a replacement for
#      a network firewall rule.
#   6. Run nginx -t && systemctl reload nginx.
#
# Notes:
#   - CF-Connecting-IP is trusted only when the peer is in Cloudflare ranges.
#   - No proxy_cache is configured. Images rely on Cloudflare and browser
#     caching, so small origin disks will not fill with image cache files.
#   - API disables upstream compression so sub_filter can rewrite JSON.
# =====================================================================

# ---- Cloudflare real client IP + origin guard ------------------------
# Keep these ranges current. For automation, generate this block from:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

geo $realip_remote_addr $from_cloudflare {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2405:8100::/32 1;
    2405:b500::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ---- HTTP / ACME -----------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com img.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- API: api.example.com -> api.bgm.tv ------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    if ($from_cloudflare = 0) {
        return 403;
    }

    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    set $bangumi_api_upstream api.bgm.tv;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,User-Agent" always;
    add_header Access-Control-Max-Age "86400" always;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location = /__health {
        default_type application/json;
        return 200 '{"ok":true,"role":"api","upstream":"api.bgm.tv","cache":"off"}\n';
    }

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass https://$bangumi_api_upstream$request_uri;
        proxy_set_header Host api.bgm.tv;
        proxy_ssl_server_name on;
        proxy_ssl_name api.bgm.tv;
        proxy_redirect https://lain.bgm.tv/ https://img.example.com/;
        proxy_redirect http://lain.bgm.tv/ https://img.example.com/;

        proxy_set_header Accept-Encoding "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        sub_filter_once off;
        sub_filter_types application/json text/plain;
        sub_filter "https://lain.bgm.tv" "https://img.example.com";
        sub_filter "http://lain.bgm.tv" "https://img.example.com";
        sub_filter "lain.bgm.tv" "img.example.com";

        proxy_connect_timeout 8s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
    }
}

# ---- Images: img.example.com -> lain.bgm.tv --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name img.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    if ($from_cloudflare = 0) {
        return 403;
    }

    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    set $bangumi_img_upstream lain.bgm.tv;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location = /__health {
        default_type application/json;
        return 200 '{"ok":true,"role":"img","upstream":"lain.bgm.tv","cache":"cloudflare-only"}\n';
    }

    location / {
        proxy_pass https://$bangumi_img_upstream$request_uri;
        proxy_set_header Host lain.bgm.tv;
        proxy_ssl_server_name on;
        proxy_ssl_name lain.bgm.tv;

        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_ignore_headers Set-Cookie;

        proxy_connect_timeout 8s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }
}

# ---- Firewall requirement --------------------------------------------
# Enforce "only Cloudflare can reach 443" with nftables or your provider
# firewall. Example chain body:
#
#   iif "lo" accept
#   tcp dport 443 ip saddr { <Cloudflare IPv4 CIDRs> } accept
#   tcp dport 443 ip6 saddr { <Cloudflare IPv6 CIDRs> } accept
#   tcp dport 443 drop
#
# Keep SSH and port 80 outside this drop rule unless you explicitly want to
# restrict them too.
